<html lang="es"><head><meta charset="utf-8">

<title>Sano Móvil · Demo interactivo</title>
<style>
:root{--pg:#AFC3B4;--bg:#FBFAF6;--card:#fff;--bd:#E5E3DA;--tonal:#E2EEE6;--azul:#DDE8F1;--lila:#ECE8F4;--btn:#3F6B57;--on:#fff;--tx:#22332B;--soft:#55655D;--ok:#2C6A4A;--warn:#8A5A00;--bad:#A82A2A;--okbg:#E4F1E8;--wbg:#FBEFD2;--bbg:#F8E1E1;--marco:#2F473C;--o1:#B5D3C2;--o2:#7BAA90;--onola:#1F3A2E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0C1411;--bg:#111A16;--card:#1A2520;--bd:#2B3A33;--tonal:#23352C;--azul:#223340;--lila:#2D2A3B;--btn:#86C8A8;--on:#0E2218;--tx:#E9F1EC;--soft:#A9BAB1;--ok:#7DD3A0;--warn:#F0BE5A;--bad:#F29A9A;--okbg:#1E3A2D;--wbg:#3A2F14;--bbg:#3D2020;--marco:#5E8F78;--o1:#3F7F63;--o2:#255A43;--onola:#F2FAF5;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0C1411;--bg:#111A16;--card:#1A2520;--bd:#2B3A33;--tonal:#23352C;--azul:#223340;--lila:#2D2A3B;--btn:#86C8A8;--on:#0E2218;--tx:#E9F1EC;--soft:#A9BAB1;--ok:#7DD3A0;--warn:#F0BE5A;--bad:#F29A9A;--okbg:#1E3A2D;--wbg:#3A2F14;--bbg:#3D2020;--marco:#5E8F78;--o1:#3F7F63;--o2:#255A43;--onola:#F2FAF5;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--pg);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pg);z-index:10}
#stage{transform-origin:center center;display:flex;flex-direction:column;align-items:center;gap:8px}
.phone{width:393px;height:852px;background:var(--bg);border-radius:38px;border:1.5px solid var(--bd);box-shadow:0 20px 56px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;position:relative}
.cap{font-size:12px;color:var(--soft)}
@media(max-width:500px){#stage{width:100%;height:100%;gap:0}.phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}.cap{display:none}}
main{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{margin:0}.b{font-weight:700}.s{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tap{cursor:pointer}.tap:active{opacity:.85}
.row{display:flex;gap:12px}.rowc{display:flex;align-items:center}
.ib{width:48px;height:48px;border-radius:16px;border:0;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cq{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--btn);flex:none}
.tel{flex:1;height:250px;border-radius:36px;background:var(--marco);padding:7px;box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:pointer}
.tel>div{position:relative;height:100%;border-radius:29px;overflow:hidden;background:var(--card)}
.tel canvas{position:absolute;inset:0;width:100%;height:100%}
.tel .tx{position:absolute;top:52px;left:0;right:0;text-align:center;color:var(--onola)}
.dots{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:6px;padding:12px 14px}.dots i{border-radius:50%;background:var(--onola)}
.col{flex:1;display:flex;flex-direction:column;gap:12px;height:250px;min-width:0}.col>*{flex:1}
.esc{border-radius:24px;background:var(--azul);position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:center}
.esc::after{content:"";position:absolute;top:6px;right:6px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25)}
.pt{width:10px;height:10px;border-radius:50%;flex:none}
.pn{border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on);font-weight:700;flex:none}
.bs{display:block;width:100%;min-height:64px;border:0;border-radius:20px;background:var(--btn);color:var(--on);font:700 20px Roboto,system-ui,sans-serif;padding:14px 16px;cursor:pointer}
.bs.c{min-height:52px;font-size:16px;padding:8px 16px}.bs.sec{background:var(--tonal);color:var(--btn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--card)}.chip.on{background:var(--btn);color:var(--on);border-color:var(--btn)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.li:first-child{border-top:0}.li>div:nth-child(2){flex:1;min-width:0}
.bar{height:12px;border-radius:9px;background:var(--tonal);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--btn);border-radius:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav{padding:10px 16px}.nav>div{display:flex;gap:4px;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:32px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.nav button{flex:1;border:0;background:none;color:var(--soft);border-radius:24px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:500 14px Roboto,system-ui,sans-serif;line-height:1.15}
.nav button.on{background:var(--tonal);color:var(--tx);font-weight:700}.nav .ic{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center}.nav .on .ic{background:var(--btn);color:var(--on)}
.vid{height:300px;border-radius:24px;background:var(--azul);display:flex;align-items:center;justify-content:center}.vid i{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
.toast{position:absolute;left:20px;right:20px;bottom:110px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.on{opacity:1}
</style></head>
<body><div id="stage"><div class="phone"><main id="v"></main><div class="nav" id="nv"></div><div class="toast" id="ts"></div></div><div class="cap">Demo interactivo con datos de ejemplo · Sano Móvil</div></div>

19 14.5 12 21 12 21 Z M14.5 9.5 A2.5 2.5 0 1 1 9.5 9.5 A2.5 2.5 0 1 1 14.5 9.5 Z",per:"M15 8 A3 3 0 1 1 9 8 A3 3 0 1 1 15 8 Z M5 20 C5 16 8 14 12 14 C16 14 19 16 19 20",hoja:"M5 19 C5 10 10 5 20 4 C20 14 15 19 6 19 Z M5 19 L14 10",atr:"M15 5 L8 12 L15 19",img:"M5 4 H19 A2 2 0 0 1 21 6 V18 A2 2 0 0 1 19 20 H5 A2 2 0 0 1 3 18 V6 A2 2 0 0 1 5 4 Z M10.5 9 A1.5 1.5 0 1 1 7.5 9 A1.5 1.5 0 1 1 10.5 9 Z M3 17 L9 12 L13 16 L16 13 L21 18",vid:"M3 6 H16 A1 1 0 0 1 17 7 V17 A1 1 0 0 1 16 18 H3 A1 1 0 0 1 2 17 V7 A1 1 0 0 1 3 6 Z M17 10 L22 7 V17 L17 14 Z",aud:"M9 18 V6 L19 4 V16 M9 18 A3 3 0 1 1 3 18 A3 3 0 1 1 9 18 Z M19 16 A3 3 0 1 1 13 16 A3 3 0 1 1 19 16 Z",doc:"M7 3 H14 L19 8 V19 A2 2 0 0 1 17 21 H7 A2 2 0 0 1 5 19 V5 A2 2 0 0 1 7 3 Z M14 3 V8 H19 M8 13 H16 M8 17 H13",des:"M4 15 V19 H20 V15 M12 4 V14 M7.5 9.5 L12 14 L16.5 9.5",app:"M4 4 H10 V10 H4 Z M14 4 H20 V10 H14 Z M4 14 H10 V20 H4 Z M14 14 H20 V20 H14 Z"};
const $=s=>document.querySelector(s);
const ic=(k,z=24,c="currentColor")=>`<svg class="i" width="${z}" height="${z}" viewBox="0 0 24 24" style="color:${c}"><path d="${P[k]}"/></svg>`;

acc:["Revisar los servicios de accesibilidad",[["Qué son","Son ayudas para leer o controlar la pantalla. Algunas apps dañinas se hacen pasar por una."],["Revisa la lista","Entra a Ajustes, Accesibilidad, y mira cuáles están activas."],["Desactiva lo que no reconozcas","Si no sabes para qué sirve, apágala. Puedes volver a activarla."]]]};

return `<div class="rowc" style="justify-content:space-between;align-items:flex-start"><div style="padding-right:8px"><div class="rowc" style="gap:6px"><span class="b s" style="font-size:14px">SanoMovil</span>${ic("hoja",16,"var(--btn)")}</div>${tx("Hola",28,{b:1})}</div>
